apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "kubebuilder-updates.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - webapp.int128.github.io
  resources:
  - guestbooks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - webapp.int128.github.io
  resources:
  - guestbooks/finalizers
  verbs:
  - update
- apiGroups:
  - webapp.int128.github.io
  resources:
  - guestbooks/status
  verbs:
  - get
  - patch
  - update
